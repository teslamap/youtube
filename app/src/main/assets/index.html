<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Music</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10131a;color:#f4f6fb;font:16px system-ui,Arial}.wrap{max-width:720px;margin:auto;padding:22px}.brand{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:750;margin:12px 0 24px}.logo{background:#ff0033;border-radius:14px;padding:10px}.sub{color:#9da7b8;margin:-16px 0 22px}.search{display:flex;gap:8px}input{min-width:0;flex:1;background:#202633;border:1px solid #343d4e;border-radius:13px;padding:14px;color:white;font-size:15px}button{border:0;border-radius:13px;padding:0 18px;background:#ff1744;color:white;font-weight:700;font-size:15px}#key{width:100%;margin-top:10px}.hint{color:#8590a2;font-size:12px;margin:8px 2px 20px}.item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #272e3b;align-items:center}.item img{width:128px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#252b36}.title{font-weight:650;line-height:1.3}.channel{font-size:13px;color:#9da7b8;margin-top:6px}.play{margin-left:auto;padding:11px 13px;background:#283244}.error{color:#ff8b9f;margin:14px 0}a{color:inherit;text-decoration:none}
</style></head><body><main class="wrap"><div class="brand"><span class="logo">▶</span> YouTube Music</div><p class="sub">მოძებნე მუსიკა YouTube-ზე</p>
<div class="search"><input id="q" placeholder="სიმღერის ან შემსრულებლის სახელი"><button onclick="search()">ძებნა</button></div>
<input id="key" placeholder="YouTube Data API key (შეინახება ამ მოწყობილობაზე)">
<div class="hint">ძიება აჩვენებს ვიდეოს ინფორმაციას. დაკვრა ხელმისაწვდომია YouTube-ის ოფიციალური player-ით ან ნებადართული აუდიოწყაროდან.</div><div id="error" class="error"></div><section id="results"></section></main>
<script>
const key=document.getElementById('key'),q=document.getElementById('q');key.value=localStorage.getItem('yt_api_key')||'';key.addEventListener('change',()=>localStorage.setItem('yt_api_key',key.value));
function search(){document.getElementById('error').textContent='';if(!key.value.trim()){showError('შეიყვანე YouTube Data API key');return}if(!q.value.trim())return;document.getElementById('results').innerHTML='<p class="hint">იტვირთება…</p>';Android.search(q.value.trim(),key.value.trim())}
q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
function renderResults(raw){const rows=JSON.parse(raw);document.getElementById('error').textContent='';document.getElementById('results').innerHTML=rows.map(x=>'<article class="item"><img src="'+esc(x.thumbnail)+'"><div style="flex:1;min-width:0"><div class="title">'+esc(x.title)+'</div><div class="channel">'+esc(x.channel)+'</div></div><button class="play" onclick="openVideo(\''+esc(x.id)+'\')">▶</button></article>').join('')||'<p class="hint">შედეგები ვერ მოიძებნა</p>'}
function openVideo(id){document.getElementById('error').textContent='ვიდეოს გასახსნელად გამოიყენე YouTube აპი ან ბრაუზერი.';window.open('https://www.youtube.com/watch?v='+encodeURIComponent(id),'_blank')}
function showError(msg){document.getElementById('error').textContent=msg;document.getElementById('results').innerHTML=''}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
